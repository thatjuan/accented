<?xml version="1.0" encoding="UTF-8"?>
<!--
  Accented install-DMG background. Logical canvas 640x400; rasterized to a HiDPI TIFF
  (640x400 @1x + 1280x800 @2x) via tiffutil. Finder draws the real Accented.app and
  Applications icons on top, centered at logical {160,205} and {480,205} (icon size 100).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221c18"/>
      <stop offset="1" stop-color="#161310"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b86d"/>
      <stop offset="1" stop-color="#d4784a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3a3028" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#2a241e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a241e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h  { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="640" height="400" fill="url(#ground)"/>
  <rect x="0" y="0" width="640" height="1" fill="#4a4036" opacity="0.5"/>

  <circle cx="160" cy="205" r="92" fill="url(#glow)"/>
  <circle cx="480" cy="205" r="92" fill="url(#glow)"/>

  <text class="h" x="320" y="64" text-anchor="middle" fill="#e8b86d"
        font-size="12" font-weight="600" letter-spacing="3">INSTALL ACCENTED</text>
  <text class="h" x="320" y="98" text-anchor="middle" fill="#f4eee6"
        font-size="24" font-weight="600">Drag Accented onto Applications</text>
  <text class="h" x="320" y="124" text-anchor="middle" fill="#d9d0c4" opacity="0.75"
        font-size="13" font-weight="400">Drop it on the folder to install, then launch from Applications.</text>

  <!-- Arrow between the two icon wells -->
  <g fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="205" x2="370" y2="205"/>
    <polyline points="352,190 370,205 352,220"/>
  </g>
</svg>
